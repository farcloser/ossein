# Full product build on the only platform that can link it. GitHub macOS
# runners cannot boot VZ (no nested virtualization), so `ossein doctor` stays
# a laptop check — this validates up to the signed binary only.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      - name: Install pinned tools
        run: aqua install --only-link

      - name: Build (kernel fetch + verify, initfs, embed, codesign)
        run: just build

      - name: Smoke-test the binary (no VM)
        run: ./build/ossein version
