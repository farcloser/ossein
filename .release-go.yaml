# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Twin of `just build` and `do build go`: same embedded artifacts, flags, and
# ad-hoc codesign — a change to one lands in all three. macos-26 runner because
# the vendored vz needs the macOS 26 SDK.
version: 2
project_name: ossein
dist: .build/release

before:
  hooks:
    # Does not refresh an existing pkg/guestartifacts/kernel-arm64 — a stale
    # local kernel ships as-is.
    - just _guest-artifacts

builds:
  - id: ossein
    main: ./cmd/ossein
    binary: ossein
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    buildmode: pie
    ldflags:
      # BUILD_GO_LDFLAGS is exported by the root Justfile; run goreleaser
      # through `just`, never bare, or the buildkit pin is empty.
      - -s -w -X main.version={{ .Version }} {{ .Env.BUILD_GO_LDFLAGS }}
    targets:
      - darwin_arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      # Ad-hoc signature carrying the Virtualization entitlement — the same
      # signature `just build` applies. The signing policy's exception
      # (limen book/releasing.md, "The signing and provenance policy"): a
      # binary that needs an entitlement to run at all is signed ad hoc for
      # it and no further; no Developer ID, not notarized (README, Install).
      post:
        - codesign --force --sign - --timestamp=none --entitlements vz.entitlements {{ .Path }}

  # The docker-shaped front (cmd/ossein-docker). Same flags and stamping; no
  # entitlement, since it never touches Virtualization.framework itself — it
  # execs its sibling `ossein`, which is why the two ship in ONE archive.
  - id: ossein-docker
    main: ./cmd/ossein-docker
    binary: ossein-docker
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    buildmode: pie
    ldflags:
      - -s -w -X main.version={{ .Version }} {{ .Env.BUILD_GO_LDFLAGS }}
    targets:
      - darwin_arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: ["tar.gz"]

checksum:
  name_template: checksums.txt

signs:
  - cmd: just
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - do
      - release-sign
      - "${artifact}"
      - "${signature}"

release:
  prerelease: auto
  replace_existing_artifacts: true

changelog:
  use: github-native

sboms:
  - artifacts: archive
    env:
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true
      - SYFT_CHECK_FOR_APP_UPDATE=false
      - HERMETIC_ROOT_DIR={{ envOrDefault "HERMETIC_ROOT_DIR" "" }}
      - HERMETIC_CONFIG={{ envOrDefault "HERMETIC_CONFIG" "" }}
